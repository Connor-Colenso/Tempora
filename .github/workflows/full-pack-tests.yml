
name: Full pack tests

# Tempora in the latest GTNH daily server, running every mod's Horizon-QA tests. Catches what the dev workspace can't,
# a mod in the pack interacting with Tempora, e.g. WarpTheory's command check throwing for test players. Its own file
# so updating build-and-test.yml with the rest of GTNH never touches it

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-pack-tests:
    name: Full pack tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      REPORTS: build/horizonqa-fullpack
      SERVER: run/fullpack/Server
    steps:
      - name: Checkout mod repo
        uses: actions/checkout@v5
        with:
          # GTNHGradle takes the mod's version from git
          fetch-depth: 0

      - name: Checkout workflows repo
        uses: actions/checkout@v5
        with:
          repository: GTNewHorizons/GTNH-Actions-Workflows
          path: .gtnh-workflows

      - name: Keep the workflow's own files out of git status
        # Untracked paths would make the version end in -dirty
        run: printf '%s\n' /.gtnh-workflows/ >> .git/info/exclude

      # Resolved once so the whole job, and its cache key, use one daily even if a new one is published mid run
      - name: Pick the latest daily
        id: daily
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh api repos/GTNewHorizons/GTNH-Daily-Builds/releases/latest --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Testing against GTNH \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Determine JDK versions
        id: list-jdk-versions
        run: |
          (
            echo 'java-versions<<EOF'
            echo 8
            echo 17
            echo 21
            if [[ -f gradle/gradle-daemon-jvm.properties ]]; then
              yq -pprops -oprops '.toolchainVersion' gradle/gradle-daemon-jvm.properties
            fi
            echo EOF
          ) | tee -a "$GITHUB_OUTPUT"

      - name: Set up JDK versions
        uses: actions/setup-java@v5
        with:
          java-version: ${{ steps.list-jdk-versions.outputs.java-versions }}
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      # The server zip is ~570 MB. Exact key only, restoring an older daily would just be saved again alongside it
      - name: Cache the daily
        uses: actions/cache@v5
        with:
          path: ~/.gradle/caches/gtnh-fullpack
          key: gtnh-fullpack-server-${{ steps.daily.outputs.tag }}

      - name: Setup the workspace
        run: chmod +x gradlew && ./gradlew --build-cache --stacktrace setupCIWorkspace

      # Fails if a required test fails, or if the server stops before Horizon-QA writes its report (e.g. a crash)
      - name: Run every Horizon-QA test in the pack
        id: tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./gradlew --build-cache --stacktrace runFullPackServerTests
          -PfullPack.tag=${{ steps.daily.outputs.tag }}
          < /dev/null

      - name: Summarize Horizon-QA result
        if: ${{ always() && steps.tests.conclusion != 'skipped' }}
        continue-on-error: true
        run: bash .gtnh-workflows/scripts/summarize_horizonqa_result "$REPORTS/horizonqa-result.json"

      - name: Upload reports and server logs
        if: ${{ always() && steps.tests.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: ${{ github.repository_id }}-horizonqa-fullpack
          path: |
            ${{ env.REPORTS }}/
            ${{ env.SERVER }}/logs/
            ${{ env.SERVER }}/crash-reports/
          if-no-files-found: ignore
          retention-days: 30
